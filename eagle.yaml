trust_remote_code: true

kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.8

speculative_config:
  # On the PyTorch backend, `decoding_type: Eagle` is a backward-compatible
  # alias that runs the Eagle3 algorithm (per TRT-LLM spec-decoding docs).
  # The literal string "Eagle3" was only added to the enum in >= 1.2.0rc6;
  # 1.1.0rc2 will reject it. The Eagle3 draft checkpoint still loads correctly.
  decoding_type: Eagle
  max_draft_len: 3
  speculative_model_dir: /config/models/eagle/

cuda_graph_config:
  max_batch_size: 10

sampler_type: TorchSampler

moe_config:
  backend: TRTLLM

# long-context stability
enable_attention_dp: false
disable_overlap_scheduler: true

# Required for /metrics to expose speculative-decoding iter stats
# (accepted_draft_tokens / total_draft_tokens). PyTorch backend: beta.
enable_iter_perf_stats: true
